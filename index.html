<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robotics Team Attendance</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="login-screen" class="login-screen">
      <section class="login-panel">
        <div>
          <p class="eyebrow">Team Operations</p>
          <h1>JTeChmasters Attendance Hub</h1>
          <p class="muted">
            Track meetings, attendance scores, messages, and project work for every section.
          </p>
        </div>

        <form id="login-form" class="form-card">
          <label>
            Email
            <input id="login-email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-btn" type="submit">
            <i data-lucide="log-in"></i>
            Sign in
          </button>
          <p id="login-error" class="error-text" role="alert"></p>
        </form>

        <div class="demo-logins">
          <p class="section-label">Demo Accounts</p>
          <button data-login="coach@team.local">Coach</button>
          <button data-login="engineering@team.local">Engineering Head</button>
          <button data-login="media@team.local">Media Head</button>
          <button data-login="alex@team.local">Member</button>
        </div>
      </section>
    </main>

    <main id="app" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="assets/jtechmasters-logo.svg" alt="JTeChmasters logo" />
          <div>
            <strong>JTeChmasters</strong>
            <small>Attendance Hub</small>
          </div>
        </div>
        <nav class="nav-list" aria-label="Dashboard sections">
          <button class="nav-item active" data-view="dashboard">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
          </button>
          <button class="nav-item" data-view="members">
            <i data-lucide="users"></i>
            Members
          </button>
          <button class="nav-item" data-view="meetings">
            <i data-lucide="calendar-check"></i>
            Meetings
          </button>
          <button class="nav-item" data-view="agenda">
            <i data-lucide="calendar-days"></i>
            Agenda
          </button>
          <button class="nav-item" data-view="messages">
            <i data-lucide="messages-square"></i>
            Messages
          </button>
          <button class="nav-item" data-view="portfolio">
            <i data-lucide="folder-kanban"></i>
            Portfolio
          </button>
        </nav>
        <button id="reset-demo" class="ghost-btn">
          <i data-lucide="rotate-ccw"></i>
          Reset demo data
        </button>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="role-label"></p>
            <h2 id="view-title">Dashboard</h2>
          </div>
          <div class="user-pill">
            <span id="user-name"></span>
            <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out">
              <i data-lucide="log-out"></i>
            </button>
          </div>
        </header>

        <section id="view-root" class="view-root" aria-live="polite"></section>
      </section>
    </main>
  </body>
</html>
