<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JTeChmasters</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="public-site" class="public-site">
      <header class="public-topbar">
        <div class="brand">
          <img class="brand-logo" src="assets/jtechmasters-logo.svg" alt="JTeChmasters logo" />
          <div>
            <strong>JTeChmasters</strong>
            <small>FTC robotics team</small>
          </div>
        </div>
        <nav class="public-nav" aria-label="Public pages">
          <a href="index.html">Home</a>
          <a href="blogs/">Blogs</a>
          <a href="about/">About</a>
          <button id="open-login" class="primary-btn">
            <i data-lucide="lock-keyhole"></i>
            Member login
          </button>
        </nav>
      </header>

      <section class="public-hero">
        <div>
          <p class="eyebrow">Team Updates</p>
          <h1>Building robots, code, media, and match-day momentum.</h1>
          <p id="public-about-summary" class="muted"></p>
          <div id="public-social-links" class="social-links" aria-label="Team links"></div>
        </div>
      </section>

      <section id="public-about" class="public-about" aria-label="About JTeChmasters"></section>

      <section id="public-posts" class="public-grid" aria-label="Public team posts">
        <div class="empty-state">Loading team posts...</div>
      </section>
    </main>

    <main id="login-screen" class="login-screen hidden">
      <section class="login-panel">
        <div>
          <p class="eyebrow">Team Operations</p>
          <h1>Member Operations</h1>
          <p class="muted">
            Track meetings, attendance scores, messages, and project work for every section.
          </p>
        </div>

        <form id="login-form" class="form-card">
          <label>
            Email
            <input id="login-email" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-btn" type="submit">
            <i data-lucide="log-in"></i>
            Sign in
          </button>
          <p id="login-error" class="error-text" role="alert"></p>
          <button id="back-public" class="ghost-btn" type="button">
            <i data-lucide="arrow-left"></i>
            Back to public page
          </button>
        </form>
      </section>
    </main>

    <main id="app" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="assets/jtechmasters-logo.svg" alt="JTeChmasters logo" />
          <div>
            <strong>JTeChmasters</strong>
            <small>Attendance Hub</small>
          </div>
        </div>
        <nav class="nav-list" aria-label="Dashboard sections">
          <button class="nav-item active" data-view="dashboard">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
          </button>
          <button class="nav-item" data-view="members">
            <i data-lucide="users"></i>
            Members
          </button>
          <button class="nav-item" data-view="meetings">
            <i data-lucide="calendar-check"></i>
            Meetings
          </button>
          <button class="nav-item" data-view="agenda">
            <i data-lucide="calendar-days"></i>
            Agenda
          </button>
          <button class="nav-item" data-view="messages">
            <i data-lucide="messages-square"></i>
            Messages
          </button>
          <button class="nav-item" data-view="portfolio">
            <i data-lucide="folder-kanban"></i>
            Portfolio
          </button>
          <button class="nav-item" data-view="site">
            <i data-lucide="globe"></i>
            Public Site
          </button>
        </nav>
        <button id="reset-demo" class="ghost-btn">
          <i data-lucide="rotate-ccw"></i>
          Reset demo data
        </button>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="role-label"></p>
            <h2 id="view-title">Dashboard</h2>
          </div>
          <div class="user-pill">
            <span id="user-name"></span>
            <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out">
              <i data-lucide="log-out"></i>
            </button>
          </div>
        </header>

        <section id="view-root" class="view-root" aria-live="polite"></section>
      </section>
    </main>
  </body>
</html>
