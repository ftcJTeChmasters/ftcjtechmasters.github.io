<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs | JTeChmasters</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../supabase-config.js" defer></script>
    <script src="../app.js" defer></script>
  </head>
  <body>
    <main id="public-site" class="public-site">
      <header class="public-topbar">
        <a class="brand brand-link" href="../">
          <img class="brand-logo" src="../assets/jtechmasters-logo.svg" alt="JTeChmasters logo" />
          <div>
            <strong>JTeChmasters</strong>
            <small>FTC robotics team</small>
          </div>
        </a>
        <nav class="public-nav" aria-label="Public pages">
          <a href="../">Home</a>
          <a href="./" aria-current="page">Blogs</a>
          <a href="../about/">About</a>
          <a class="primary-btn" href="../">
            <i data-lucide="lock-keyhole"></i>
            Member login
          </a>
        </nav>
      </header>

      <section class="page-hero">
        <p class="eyebrow">Team Blogs</p>
        <h1>Build notes, updates, links, and field-side stories.</h1>
      </section>

      <section id="public-posts" class="public-grid public-grid-page" aria-label="Public team posts">
        <div class="empty-state">Loading team posts...</div>
      </section>
    </main>
  </body>
</html>
