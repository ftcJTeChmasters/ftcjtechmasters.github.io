<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About | JTeChmasters</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../supabase-config.js" defer></script>
    <script src="../app.js" defer></script>
  </head>
  <body>
    <main id="public-site" class="public-site">
      <header class="public-topbar">
        <a class="brand brand-link" href="../">
          <img class="brand-logo" src="../assets/jtechmasters-logo.svg" alt="JTeChmasters logo" />
          <div>
            <strong>JTeChmasters</strong>
            <small>FTC robotics team</small>
          </div>
        </a>
        <nav class="public-nav" aria-label="Public pages">
          <a href="../">Home</a>
          <a href="../blogs/">Blogs</a>
          <a href="./" aria-current="page">About</a>
          <a class="primary-btn" href="../#login">
            <i data-lucide="lock-keyhole"></i>
            Member login
          </a>
        </nav>
      </header>

      <section id="public-announcement" class="public-announcement hidden" aria-live="polite"></section>

      <section class="page-hero">
        <p class="eyebrow">About Us</p>
        <h1 id="about-page-title">About JTeChmasters</h1>
        <p id="public-about-summary" class="muted"></p>
        <div id="public-social-links" class="social-links" aria-label="Team links"></div>
      </section>

      <section id="public-about" class="public-about public-about-page" aria-label="About JTeChmasters"></section>
      <section class="public-login-strip" aria-label="Member access">
        <a class="primary-btn" href="../#login">
          <i data-lucide="lock-keyhole"></i>
          Member login
        </a>
      </section>
    </main>
  </body>
</html>
